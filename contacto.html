<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Moda Urbana - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container my-4">
        <nav class="mb-4">
            <a href="index.html" class="me-3">Inicio</a>
            <a href="servicios.html" class="me-3">Servicios</a>
            <a href="contacto.html">Contacto</a>
        </nav>

        <h2>Formulario de Contacto</h2>
        <!-- Formulario con clases sencillas -->
        <form action="#" method="POST" class="mb-5">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo:</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>

        <script>
    // 1. Crear la función validar
    function validar() {
        // Obtener el valor del campo usando getElementById y guardarlo en una variable
        let nombreUsuario = document.getElementById("nombre").value;
        
        // 2. Usar un condicional if/else
        if (nombreUsuario === "") {
            alert("Error: El campo de nombre está vacío.");
        } else {
            alert("¡Hola, " + nombreUsuario + "! Gracias por registrarte.");
        }
    }

    // 3. Conectar la función al botón usando addEventListener
    let boton = document.getElementById("btnEnviar");
    boton.addEventListener("click", validar);
</script>


        <h2>Nuestra Ubicación</h2>
        <div class="ratio ratio-16x9">
            <iframe src="https://www.google.com/maps/embed?pb=..." title="Mapa" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
