<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Moda Urbana - Inicio</title>
    <!-- CDN de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container my-4">
        <!-- Menú simple -->
        <nav class="mb-4">
            <a href="index.html" class="me-3">Inicio</a>
            <a href="servicios.html" class="me-3">Servicios</a>
            <a href="contacto.html">Contacto</a>
        </nav>

        <h1>Moda Urbana</h1>
        <p>Bienvenidos a nuestra tienda de ropa.</p>

        <!-- Imagen adaptada con Bootstrap -->
        <img src="img/logo.jpg" class="img-fluid" alt="Logo de Moda Urbana" title="Logo">

        <div class="alert alert-info mt-4">
            <h3>Aviso</h3>
            <p>¡Nuevos descuentos esta semana!</p>
        </div>
    </div>
</body>

<footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2026 Moda Urbana</p>
    <address id="dirFooter">Medellín, Colombia</address>
</footer>

<!-- Script para index.html -->
<script>
    // 1. Seleccionar el elemento por su ID
    let miDireccion = document.getElementById("dirFooter");
    
    // 2. Cambiar su color con style.color
    miDireccion.style.color = "yellow";
    
    // 3. Agregar texto adicional con innerText
    miDireccion.innerText = "Medellín, Colombia - ¡Visítanos!";
</script>

</html>
